# Default values for rag
# This is a YAML-formatted file.

# RAG Service configuration
name: rag
component: rag
partOf: microservices

# Image configuration
image:
  registry: ""
  repository:
  pullPolicy: IfNotPresent
  tag: "51"


imagePullSecrets:
  - name: kcr-regcred

nameOverride: ""
fullnameOverride: ""

# Replica count
replicaCount: 1

# Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Service configuration
service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8001  # 애플리케이션 실제 포트
      protocol: TCP
      name: http
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8001"
    prometheus.io/path: "/actuator/prometheus"

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: rag-dev.dkaffeine.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: 80
  tls: []

# ConfigMap configuration
configMap:
  enabled: false
  data: {}

# Secret configuration
secret:
  enabled: false
  name: "rag-secrets"

# Environment variables
env:
  # PostgreSQL
  POSTGRES_HOST:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: postgres_host
  POSTGRES_PORT:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: postgres_port
  POSTGRES_DB:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: postgres_db
  POSTGRES_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: postgres_password

  # Kakao Object Storage (앱 코드에서 이 이름으로 읽게 되어 있으면)
  KAKAO_ACCESS_KEY_ID:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: kakao_access_key_id
  KAKAO_SECRET_ACCESS_KEY:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: kakao_secret_access_key

  # AWS S3 / Bedrock 크레덴셜
  AWS_ACCESS_KEY_ID:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: aws_access_key_id
  AWS_SECRET_ACCESS_KEY:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: aws_secret_access_key

  # Bedrock KB (코드가 env로 읽도록 작성되어 있다면)
  BEDROCK_KNOWLEDGE_BASE_ID:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: bedrock_knowledge_base_id
  BEDROCK_DATA_SOURCE_ID:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: bedrock_data_source_id

  # Redis
  REDIS_HOST:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: redis_host
  REDIS_PORT:
    valueFrom:
      secretKeyRef:
        name: rag-secrets
        key: redis_port

# Resources
resources:
  limits:
    cpu: 1000m
    memory: 1.5Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Autoscaling
autoscaling:
  enabled: false  
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod configuration
podAnnotations: {}

# Startup probe
startupProbe:
  httpGet:
    path: /api/v1/health
    port: 8001  # 애플리케이션 로그 기준 포트
  initialDelaySeconds: 30
  periodSeconds: 30  # 30초마다 체크
  timeoutSeconds: 5
  failureThreshold: 30

# Health checks
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: 8001  # 애플리케이션 로그 기준 포트
  initialDelaySeconds: 30
  periodSeconds: 30  # 30초마다 체크
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /api/v1/health
    port: 8001  # 애플리케이션 로그 기준 포트
  initialDelaySeconds: 10
  periodSeconds: 30  # 30초마다 체크
  timeoutSeconds: 3
  failureThreshold: 3

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod security context
podSecurityContext: {}

# Container security context
securityContext: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# ServiceMonitor configuration (for Prometheus Operator)
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  path: /actuator/prometheus
  port: http

appLabel: rag-service
