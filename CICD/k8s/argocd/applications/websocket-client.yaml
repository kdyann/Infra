apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: websocket-client
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL:
    path: k8s/websocket-client/helm
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: web-socket

  revisionHistoryLimit: 10

