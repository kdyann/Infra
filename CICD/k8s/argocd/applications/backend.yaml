apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL:
    path: k8s/back/helm
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: core

  revisionHistoryLimit: 10

